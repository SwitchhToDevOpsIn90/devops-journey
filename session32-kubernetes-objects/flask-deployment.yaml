apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask
  template:
    metadata:
      labels:
        app: flask
    spec:
      containers:
      - name: flask-container
        image: <ACCOUNT_ID>.dkr.ecr.eu-north-1.amazonaws.com/flask-docker-app:k8s-arm64
        ports:
        - containerPort: 5000
        envFrom:
        - configMapRef:
            name: flask-config
      imagePullSecrets:
      - name: ecr-secret
