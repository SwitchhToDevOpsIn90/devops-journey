apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: session36-storage
  region: eu-north-1
iam:
  withOIDC: true
vpc:
  nat:
    gateway: Disable
addons:
  - name: aws-ebs-csi-driver
managedNodeGroups:
  - name: workers
    instanceType: t3.small
    desiredCapacity: 1
    minSize: 1
    maxSize: 1
