apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: retain-lab
provisioner: k8s.io/minikube-hostpath
reclaimPolicy: Retain
volumeBindingMode: Immediate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: retain-pvc
spec:
  storageClassName: retain-lab
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
