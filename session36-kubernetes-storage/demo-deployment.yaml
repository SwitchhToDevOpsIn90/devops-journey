apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storage-demo
  template:
    metadata:
      labels:
        app: storage-demo
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          volumeMounts:
            - name: demo-storage
              mountPath: /data
      volumes:
        - name: demo-storage
          persistentVolumeClaim:
            claimName: demo-pvc
