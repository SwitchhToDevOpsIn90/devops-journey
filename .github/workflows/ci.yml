name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  APP_DIR: session22-dockerfile
  IMAGE: dockerapp:${{ github.sha }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: ${{ env.APP_DIR }}/requirements*.txt
      - run: pip install -r ${{ env.APP_DIR }}/requirements-dev.txt
      - run: ruff check ${{ env.APP_DIR }}

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ${{ env.APP_DIR }}/requirements*.txt
      - name: Install (locked, hash-checked)
        working-directory: ${{ env.APP_DIR }}
        run: |
          pip install --require-hashes -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Test
        working-directory: ${{ env.APP_DIR }}
        run: python -m pytest -q --junitxml=results-${{ matrix.python-version }}.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results-${{ matrix.python-version }}
          path: ${{ env.APP_DIR }}/results-${{ matrix.python-version }}.xml
          retention-days: 7

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ env.APP_DIR }}
          tags: ${{ env.IMAGE }}
          outputs: type=docker,dest=/tmp/image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: /tmp/image.tar
          retention-days: 1

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: image, path: /tmp }
      - run: |
          docker load -i /tmp/image.tar
          docker run -d --name smoke -p 5000:5000 "$IMAGE"
          sleep 3
          curl -sf localhost:5000/ | tee /tmp/out.txt
          grep -q "Flask running" /tmp/out.txt
          test "$(docker exec smoke whoami)" = "appuser"

  scan:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: image, path: /tmp }
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: /tmp/image.tar
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

  ci-ok:
    if: always()
    needs: [lint, test, build, smoke, scan]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: All required jobs passed
        run: |
          echo "results: ${{ join(needs.*.result, ', ') }}"
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}; then
            echo "A required job did not succeed"; exit 1
          fi

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci-ok
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: image, path: /tmp }
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-deploy-${{ github.run_id }}
      - name: Who am I (short-lived role session, no stored keys)
        run: aws sts get-caller-identity --query Arn --output text
      - name: Push the exact image that passed smoke and scan
        env:
          ECR_REPO: ${{ vars.ECR_REPO }}
        run: |
          docker load -i /tmp/image.tar
          docker tag "$IMAGE" "$ECR_REPO:$GITHUB_SHA"
          aws ecr get-login-password | docker login --username AWS --password-stdin "${ECR_REPO%%/*}"
          docker push "$ECR_REPO:$GITHUB_SHA"
          DIGEST_REF=$(docker inspect --format '{{index .RepoDigests 0}}' "$ECR_REPO:$GITHUB_SHA")
          echo "Pushed: $DIGEST_REF"
          echo "DIGEST_REF=$DIGEST_REF" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Point kubectl at the cluster
        run: aws eks update-kubeconfig --name "${{ vars.EKS_CLUSTER }}"
      - name: Apply manifests pinned to the exact digest
        run: |
          sed "s|IMAGE_PLACEHOLDER|$DIGEST_REF|" session44-github-actions-cd/k8s/app.yaml > /tmp/app.yaml
          grep -n 'image:' /tmp/app.yaml
          kubectl apply -f /tmp/app.yaml
          kubectl -n dockerapp rollout status deployment/dockerapp --timeout=180s
      - name: Smoke test inside the cluster
        run: |
          kubectl -n dockerapp port-forward svc/dockerapp 8080:80 >/tmp/pf.log 2>&1 &
          sleep 3
          curl -sf localhost:8080/ | tee /tmp/out.txt
          grep -q "Flask running" /tmp/out.txt
          kubectl -n dockerapp get deploy dockerapp -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'
      - name: Guardrail - deploy identity is boxed into its namespace
        run: |
          set -x
          test "$(kubectl auth can-i create deployments -n dockerapp)" = "yes"
          test "$(kubectl auth can-i create deployments -n kube-system)" = "no"
          test "$(kubectl auth can-i get secrets -n kube-system)" = "no"
          test "$(kubectl auth can-i create namespaces)" = "no"
